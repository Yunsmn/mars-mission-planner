<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MARVIN Mission Control</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand"><span class="mark"></span> MARVIN <span class="thin">MISSION CONTROL</span></div>
    <div class="comms" id="comms"><span class="dot"></span> LINK ▸ <span id="comms-txt">standby</span></div>
    <div class="backend" id="backend">ground: —</div>
  </header>

  <main class="main">
    <section class="left">
      <div class="chips">
        <div class="chip" id="chip-houston">
          <svg viewBox="0 0 40 40" class="glyph" aria-hidden="true">
            <circle cx="20" cy="24" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="24" x2="30" y2="9" stroke="currentColor" stroke-width="2"/>
            <circle cx="31" cy="8" r="2.4" fill="currentColor"/>
          </svg>
          <div class="who"><b>HOUSTON</b><span>ground · cloud Granite</span></div>
          <span class="statedot" id="state-houston"></span>
        </div>
        <div class="track" id="track">
          <span class="signal" id="signal"></span>
          <span class="tracklabel" id="tracklabel">Earth ⇄ Mars</span>
        </div>
        <div class="chip right" id="chip-marvin">
          <span class="statedot" id="state-marvin"></span>
          <div class="who"><b>MARVIN</b><span>onboard · granite4.1:3b</span></div>
          <svg viewBox="0 0 40 40" class="glyph" aria-hidden="true">
            <rect x="12" y="14" width="16" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="14" x2="20" y2="8" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="7" r="1.8" fill="currentColor"/>
            <circle cx="15" cy="27" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="25" cy="27" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
      </div>

      <div class="transcript" id="transcript"></div>

      <form class="inputrow" id="form" autocomplete="off">
        <input id="input" placeholder="Give an intent — e.g. get me a sample from the carbonate outcrop east of the dunes" />
        <button type="submit">TRANSMIT</button>
      </form>
    </section>

    <aside class="downlink" id="downlink">
      <div class="panel muted" id="empty">Downlink zone — MARVIN's products appear here.</div>
    </aside>
  </main>

  <footer class="ftr">
    <span>The LLM decides · the gate approves · the controller drives. No model commands actuators.</span>
    <span id="footnote"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
